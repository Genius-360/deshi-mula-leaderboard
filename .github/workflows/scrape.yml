name: Scrape & Update Leaderboard

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours (~120 min/month, well within free tier)
  workflow_dispatch:          # Manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    name: Run Scraper & Commit Data
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Node.js setup ──────────────────────────────────────
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. System deps for Puppeteer's Chromium ───────────────
      - name: Install Chromium System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ca-certificates \
            fonts-liberation \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libc6 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgbm1 \
            libgcc1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            lsb-release \
            wget \
            xdg-utils 2>/dev/null || true

      # ── 4. Install Node dependencies (includes Puppeteer) ─────
      - name: Install Node Dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "false"

      # ── 5. Run the scraper ────────────────────────────────────
      - name: Run Scraper Engine
        run: node scraper.js
        env:
          NODE_OPTIONS: "--max-old-space-size=512"

      # ── 6. Check if data actually changed ────────────────────
      - name: Check for Data Changes
        id: check_changes
        run: |
          if git diff --quiet data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in data.json."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            COMPANY_COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('data.json','utf8')); console.log(d.total_companies);")
            echo "Companies in new data: $COMPANY_COUNT"
          fi

      # ── 7. Commit & push ONLY if data changed ────────────────
      - name: Commit Updated Data
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "data: auto-update leaderboard [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      # ── 8. Summary ────────────────────────────────────────────
      - name: Pipeline Summary
        run: |
          echo "══════════════════════════════════"
          echo " Pipeline complete."
          echo " Data changed: ${{ steps.check_changes.outputs.changed }}"
          echo " Run time:     $(date -u)"
          echo "══════════════════════════════════"
